plugins { id 'com.android.application' }

android {
    namespace 'to.donkey.tv'
    compileSdk 34

    defaultConfig {
        applicationId "to.donkey.tv"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
        buildConfigField "String", "DEFAULT_TMDB_KEY", "\"${project.findProperty('tmdbKey') ?: ''}\""
    }

    signingConfigs {
        fixed {
            storeFile file("../donkey.jks")
            storePassword "donkeytv"
            keyAlias "donkey"
            keyPassword "donkeytv"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
