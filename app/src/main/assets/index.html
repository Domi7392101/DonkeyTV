<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="app.css">
</head><body>
<div id="splash"><div class="word">DONKEY</div><div class="sweep"></div></div>
<div id="amb"><div class="l"></div><div class="l"></div></div>
<header id="nav" data-zone="nav"></header>
<main id="view"></main>
<div id="toast"></div>
<script>
(function () {
  var s = document.getElementById('splash'), skip = false;
  try { skip = Native.getPref('intro', '1') === '0' || Native.sessGet('splash') === '1'; } catch (e) {}
  if (skip) { s.remove(); return; }
  try { Native.sessSet('splash', '1'); } catch (e) {}
  setTimeout(function () { s.remove(); }, 1500);
})();
</script>
<script src="app.js"></script>
</body></html>
