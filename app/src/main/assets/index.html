<script>
(function () {
  var s = document.getElementById('splash'), skip = false;
  try { skip = Native.getPref('intro', '1') === '0' || Native.sessGet('splash') === '1'; }
  catch (e) { try { skip = !!sessionStorage.dkSplash; } catch (e2) {} }
  if (skip) { s.parentNode.removeChild(s); return; }
  try { Native.sessSet('splash', '1'); } catch (e) { try { sessionStorage.dkSplash = 1; } catch (e2) {} }
})();
</script>
