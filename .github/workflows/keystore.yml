name: Make keystore
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          keytool -genkeypair -v -keystore donkey.jks -alias donkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass donkeytv -keypass donkeytv -dname "CN=DonkeyTV"
      - uses: actions/upload-artifact@v4
        with:
          name: donkey-keystore
          path: donkey.jks
